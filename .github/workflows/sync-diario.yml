name: Sync Diario Rama Judicial

on:
  schedule:
    # 6:00 AM hora Bogotá = 11:00 AM UTC (L-V)
    - cron: '0 11 * * 1-5'
  workflow_dispatch:  # permite correrlo manualmente desde GitHub

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Disparar sync en Render
        run: |
          curl -s -o /tmp/response.json -w "%{http_code}" \
            -X POST https://rama-judicial-bot.onrender.com/run-sync \
            -H "x-sync-secret: ${{ secrets.SYNC_SECRET }}" \
            -H "Content-Type: application/json"
          cat /tmp/response.json
